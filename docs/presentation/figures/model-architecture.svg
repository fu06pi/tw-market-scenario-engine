<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="740" viewBox="0 0 1360 740" style="font-family:Noto Sans CJK TC,sans-serif"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a7185"/></marker></defs><rect width="1360" height="740" fill="#f8fbfc"/><text x="55" y="57" text-anchor="start" font-size="32" fill="#193a50" font-weight="bold"><tspan x="55" dy="0">模型內部結構｜哪裡更新參數？</tspan></text><text x="55" y="98" text-anchor="start" font-size="19" fill="#193a50" font-weight="normal"><tspan x="55" dy="0">相同官方權重config與forward程式；橘色為本小試驗唯一更新的輸出頭。</tspan></text><rect x="45" y="190" width="265" height="145" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="177.5" y="222" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="177.5" dy="0">歷史context</tspan><tspan x="177.5" dy="28.5">64個時間點</tspan><tspan x="177.5" dy="28.5">input patch = 32</tspan></text><rect x="380" y="190" width="265" height="145" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="512.5" y="222" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="512.5" dy="0">前處理／輸入投影</tspan><tspan x="512.5" dy="28.5">mask、RevIN</tspan><tspan x="512.5" dy="28.5">Residual Block</tspan></text><rect x="715" y="190" width="265" height="145" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="847.5" y="222" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="847.5" dy="0">Transformer 主幹</tspan><tspan x="847.5" dy="28.5">20層／寬度1280</tspan><tspan x="847.5" dy="28.5">16 heads；權重凍結</tspan></text><rect x="1050" y="190" width="265" height="145" rx="16" fill="#fff0d9" stroke="#8ca8b9"/><text x="1182.5" y="222" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="1182.5" dy="0">Linear 輸出頭</tspan><tspan x="1182.5" dy="28.5">1280 → 576</tspan><tspan x="1182.5" dy="28.5">只有這裡更新</tspan></text><path d="M310,262 H374" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M645,262 H709" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M980,262 H1044" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="440" width="380" height="130" rx="16" fill="#e7f3ee" stroke="#8ca8b9"/><text x="1120.0" y="472" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="1120.0" dy="0">分位數預測</tspan><tspan x="1120.0" dy="28.5">output patch 64 × 9分位數</tspan><tspan x="1120.0" dy="28.5">本試驗只預測1日</tspan></text><path d="M1182,335 V435" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="440" width="380" height="130" rx="16" fill="#e7f3ee" stroke="#8ca8b9"/><text x="620.0" y="472" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="620.0" dy="0">訓練目標與損失</tspan><tspan x="620.0" dy="28.5">紀錄：pinball_transformed</tspan><tspan x="620.0" dy="28.5">梯度只用來更新輸出頭</tspan></text><path d="M930,505 H815" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M620,440 V382 H1182 V340" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="55" y="640" text-anchor="start" font-size="19" fill="#193a50" font-weight="normal"><tspan x="55" dy="0">輸出頭參數：1280 × (64×9) ＋ (64×9) = 737,856，與試驗紀錄一致。</tspan><tspan x="55" dy="28.5">output patch 64 ≠ 預測64天；本次horizon=1。凍結權重不代表主幹不參與運算。</tspan></text></svg>