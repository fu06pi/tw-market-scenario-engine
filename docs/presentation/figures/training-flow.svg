<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1300" viewBox="0 0 1360 1300" style="font-family:Noto Sans CJK TC,sans-serif"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a7185"/></marker></defs><rect width="1360" height="1300" fill="#f8fbfc"/><text x="60" y="54" text-anchor="start" font-size="31" fill="#193a50" font-weight="bold"><tspan x="60" dy="0">TimesFM 模型訓練流程｜已記錄的輸出頭小試驗</tspan></text><text x="60" y="93" text-anchor="start" font-size="19" fill="#193a50" font-weight="normal"><tspan x="60" dy="0">只微調輸出頭；非全模型微調，非179日zero-shot比較。</tspan></text><rect x="60" y="145" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="230.0" y="177" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="230.0" dy="0">1  歷史資料與目標</tspan><tspan x="230.0" dy="28.5">真實 TAIEX／官方 TWSE</tspan><tspan x="230.0" dy="28.5">只用目標日前的歷史context</tspan></text><rect x="510" y="145" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="680.0" y="177" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="680.0" dy="0">2  按時間切分</tspan><tspan x="680.0" dy="28.5">訓練8窗／驗證8窗</tspan><tspan x="680.0" dy="28.5">2026/09在此試驗未評估</tspan></text><rect x="960" y="145" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="1130.0" y="177" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="1130.0" dy="0">3  建立訓練視窗</tspan><tspan x="1130.0" dy="28.5">context 64；horizon 1</tspan><tspan x="1130.0" dy="28.5">batch 1；seed 1729</tspan></text><rect x="960" y="375" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="1130.0" y="407" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="1130.0" dy="0">4  預訓練主幹前向運算</tspan><tspan x="1130.0" dy="28.5">前處理＋Residual Block</tspan><tspan x="1130.0" dy="28.5">Transformer：權重凍結</tspan></text><rect x="510" y="375" width="340" height="120" rx="16" fill="#fff0d9" stroke="#8ca8b9"/><text x="680.0" y="407" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="680.0" dy="0">5  輸出頭產生預測</tspan><tspan x="680.0" dy="28.5">Linear output_head</tspan><tspan x="680.0" dy="28.5">737,856個可訓練參數</tspan></text><rect x="60" y="375" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="230.0" y="407" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="230.0" dy="0">6  預測與訓練目標比較</tspan><tspan x="230.0" dy="28.5">損失紀錄：</tspan><tspan x="230.0" dy="28.5">pinball_transformed</tspan></text><rect x="60" y="605" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="230.0" y="637" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="230.0" dy="0">7  計算梯度</tspan><tspan x="230.0" dy="28.5">反向傳播</tspan><tspan x="230.0" dy="28.5">已記錄非零gradient</tspan></text><rect x="510" y="605" width="340" height="120" rx="16" fill="#fff0d9" stroke="#8ca8b9"/><text x="680.0" y="637" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="680.0" dy="0">8  更新輸出頭</tspan><tspan x="680.0" dy="28.5">learning rate = 0.0001</tspan><tspan x="680.0" dy="28.5">主幹權重保持固定</tspan></text><rect x="960" y="605" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="1130.0" y="637" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="1130.0" dy="0">9  本epoch的8窗完成？</tspan><tspan x="1130.0" dy="28.5">否：下一訓練視窗</tspan><tspan x="1130.0" dy="28.5">是：進入驗證</tspan></text><rect x="960" y="835" width="340" height="120" rx="16" fill="#e7f3ee" stroke="#8ca8b9"/><text x="1130.0" y="867" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="1130.0" dy="0">10  獨立驗證8窗</tspan><tspan x="1130.0" dy="28.5">前向運算／不更新參數</tspan><tspan x="1130.0" dy="28.5">記錄loss及OHLC誤差</tspan></text><rect x="510" y="835" width="340" height="120" rx="16" fill="#e7f3ee" stroke="#8ca8b9"/><text x="680.0" y="867" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="680.0" dy="0">11  依驗證pinball選模</tspan><tspan x="680.0" dy="28.5">若更佳，保留輸出頭</tspan><tspan x="680.0" dy="28.5">本試驗最佳epoch = 1</tspan></text><rect x="60" y="835" width="340" height="120" rx="16" fill="#e8f1f6" stroke="#8ca8b9"/><text x="230.0" y="867" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="230.0" dy="0">12  已完成3個epoch？</tspan><tspan x="230.0" dy="28.5">否：進入下一epoch</tspan><tspan x="230.0" dy="28.5">是：完成本次小試驗</tspan></text><path d="M400,205 H505" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M850,205 H955" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M1130,265 V370" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M960,435 H855" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M510,435 H405" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M230,495 V600" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M400,665 H505" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M850,665 H955" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M1130,725 V830" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M960,895 H855" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M510,895 H405" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M1300,665 H1330 V315 H1130 V270" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1300" y="340" text-anchor="middle" font-size="17" fill="#193a50" font-weight="normal"><tspan x="1300" dy="0">否</tspan></text><path d="M60,895 H25 V315 H1090 V270" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="105" y="307" text-anchor="start" font-size="16" fill="#193a50" font-weight="normal"><tspan x="105" dy="0">下一epoch（不是看測試集調參）</tspan></text><rect x="285" y="1040" width="790" height="125" rx="16" fill="#e7f3ee" stroke="#8ca8b9"/><text x="680.0" y="1072" text-anchor="middle" font-size="19" fill="#193a50" font-weight="normal"><tspan x="680.0" dy="0">13  保存與讀回最佳checkpoint</tspan><tspan x="680.0" dy="28.5">3 epochs × 8視窗 = 24次參數更新</tspan><tspan x="680.0" dy="28.5">保留測試未評估；不可宣稱已通過最終驗收</tspan></text><path d="M230,955 V1102 H280" fill="none" stroke="#4a7185" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="1225" text-anchor="start" font-size="17" fill="#193a50" font-weight="normal"><tspan x="60" dy="0">證據邊界：原完整訓練腳本未保留；輸入轉換細節、optimizer種類、梯度裁切等尚待補核對。</tspan><tspan x="60" dy="25.5">訓練紀錄、輸出頭checkpoint及官方forward結構已核對；本次只畫圖，沒有重新訓練。</tspan></text></svg>