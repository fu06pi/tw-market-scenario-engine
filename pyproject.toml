[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-market-scenario-engine"
version = "1.0.0a0"
description = "Auditable quantitative daily scenario generation and validation for Taiwan equities"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "requests>=2.32,<3",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
research = [
  "scipy>=1.14,<2",
  "statsmodels>=0.14.4,<0.15",
  "tejapi==0.1.31",
]
timesfm3 = [
  "timesfm[torch] @ git+https://github.com/google-research/timesfm.git@e51928e27119cb17bebc005be2696b75e0a9e688",
  "torch==2.9.1+cpu",
]

[project.scripts]
tw-scenario = "tw_scenario.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
